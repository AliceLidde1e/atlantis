<title id="title">ATLANTIS — machined brass ambigram</title>
<desc id="desc">Smooth original ambigram glyphs preserved. A-T and I-S bounding-box gaps reduced symmetrically from 8 to 4 SVG units; other letter positions unchanged. Brass surfaces with inset structural edges following each letter. No surrounding frame, pixel effects, fonts or external assets. Transparent background.</desc>
