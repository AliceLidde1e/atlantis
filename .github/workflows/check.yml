name: Check ATLANTIS site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python check_site.py
      - run: node --check site/app.mjs
      - run: node --check site/core.mjs
      - run: node --check site/site-bridge.mjs
      - run: node --check site/site-bridge-ui.mjs
