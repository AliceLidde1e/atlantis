name: Deploy ATLANTIS closed test

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'scripts/**'
      - '*.test.mjs'
      - 'check_site.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-japanese-names.mjs
      - run: node japanese-names.test.mjs
      - run: node scripts/build-editor.mjs --check
      - run: node scripts/validate-publishing.mjs
      - run: node publishing.test.mjs
      - run: node autocomplete.test.mjs
      - run: node scripts/check-editor.mjs
      - run: node scripts/rehearse-publishing.mjs
      - run: python check_site.py
      - run: node --check site/app.mjs
      - run: node --check site/core.mjs
      - run: node --check site/site-bridge.mjs
      - run: node --check site/site-bridge-ui.mjs
      - run: node printing.test.mjs
      - run: python scripts/test-printings.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
